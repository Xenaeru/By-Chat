<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="By Chat">
  <!-- Warna diambil dari DESIGN.md: {colors.primary} #2563eb untuk bentuk
       utama, {colors.primary-deep} untuk garis pesan di kiri. Tanpa gradasi
       — sistem desainnya memang flat. -->
  <!-- Garis pesan -->
  <rect x="6" y="39" width="22" height="9" rx="2" fill="#1d4ed8"/>
  <rect x="6" y="54" width="14" height="9" rx="2" fill="#1d4ed8"/>

  <!-- Balon percakapan -->
  <rect x="34" y="19" width="52" height="52" rx="16" fill="#2563eb"/>
  <path d="M45 65.5 25.5 80.5l26.5-8.5z" fill="#2563eb"/>

  <!-- Titik menulis -->
  <circle cx="48" cy="45" r="4.6" fill="#ffffff"/>
  <circle cx="60" cy="45" r="4.6" fill="#ffffff"/>
  <circle cx="72" cy="45" r="4.6" fill="#ffffff"/>
</svg>
